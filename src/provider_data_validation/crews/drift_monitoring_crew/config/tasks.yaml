drift_detection_task:
  description: |
    Provider to analyze: {provider_name}
    
    CRITICAL: You MUST use the compare_provider_data tool with provider_name: {provider_name}
    
    This tool will automatically:
    - Load historical data
    - Load current data  
    - Compare them
    - Return detected changes in JSON format
    
    DO NOT try to load or compare data manually.
    DO NOT use load_historical_provider_data or load_current_provider_data directly.
    
    ONLY use: compare_provider_data with provider_name: {provider_name}
    
    Then return the exact JSON output from that tool.
    
    ABSOLUTE RULES:
    - Call compare_provider_data ONCE with provider_name: {provider_name}
    - Return the exact JSON it provides
    - No markdown, no explanations
    - Output MUST be valid JSON
