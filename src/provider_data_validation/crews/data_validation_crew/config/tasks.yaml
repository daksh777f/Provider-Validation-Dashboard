data_extraction_task:
  description: |
    Provider to extract: {provider_name}
    
    STEP 1:
    Use the extract_provider_records tool with provider_name: {provider_name}
    
    STEP 2:
    The tool will search ALL registries:
    - NPI Registry
    - State License Registry  
    - Hospital Rosters
    - Maps/Directory Listings
    - Clinic Websites
    
    STEP 3:
    Return the complete JSON output from the tool.
    
    CRITICAL:
    - Use provider_name: {provider_name}
    - Return exact JSON from the tool
    - No modifications or filtering
    
  expected_output: >
    JSON object with all extracted provider data from available sources

  agent: data_extraction_agent

